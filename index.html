<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>春满里趣味游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <!-- 首页 -->
  <section id="homeView" class="view active">
    <header class="hero">
      <h1 class="game-title">春满里趣味游戏</h1>
      <div class="ribbon"><span>即可挑战唤醒你的春满里记忆</span></div>
    </header>

    <div class="section-label">多种主题 任你选择</div>

    <div class="category-grid" id="categoryGrid">
      <button class="cat-card cat-mingtang" data-cat="mingtang">
        <div class="cat-thumb"><img src="images/mingtang_1.jpg" alt=""></div>
        <div class="cat-name">明棠</div>
        <div class="cat-desc">明媚小太阳☀️</div>
        <div class="cat-count">6 张</div>
      </button>
      <button class="cat-card cat-zhoujinye" data-cat="zhoujinye">
        <div class="cat-thumb"><img src="images/zhoujinye_1.jpg" alt=""></div>
        <div class="cat-name">周尽野</div>
        <div class="cat-desc">可靠忠犬</div>
        <div class="cat-count">6 张</div>
      </button>
      <button class="cat-card cat-couple" data-cat="couple">
        <div class="cat-thumb"><img src="images/couple_1.jpg" alt=""></div>
        <div class="cat-name">双人拼图</div>
        <div class="cat-desc">明棠&周尽野</div>
        <div class="cat-count">6 张</div>
      </button>
      <button class="cat-card cat-family" data-cat="family">
        <div class="cat-thumb"><img src="images/family_4.jpg" alt=""></div>
        <div class="cat-name">其他拼图</div>
        <div class="cat-desc">奶奶的温馨日常</div>
        <div class="cat-count">6 张</div>
      </button>
    </div>

    <button class="primary-btn" id="startBtn">立即拼图 <span>🧩</span></button>
    <p class="hint-text">选择主题后点击「立即拼图」开始 · 也可直接点选卡片</p>
  </section>

  <!-- 素材选择页（照片展示页） -->
  <section id="selectView" class="view">
    <div class="sub-header">
      <button class="back-btn" data-back="homeView">‹ 返回</button>
      <h2 id="selectTitle">选择图片</h2>
      <span class="sub-badge">6 张可选</span>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="select-grid" id="selectGrid"></div>
    <button class="primary-btn sticky-btn" id="toPuzzleBtn">开始拼图 <span>🧩</span></button>
  </section>

  <!-- 游戏页 -->
  <section id="gameView" class="view">
    <div class="sub-header">
      <button class="back-btn" data-back="selectView">‹ 返回</button>
      <h2>拼图进行中</h2>
      <div class="game-stats"><span id="moveCount">0</span> 步</div>
    </div>

    <div class="difficulty-row">
      <span class="diff-label">难度：</span>
      <div class="diff-tabs" id="diffTabs">
        <button data-diff="3" class="active">简单 3×3</button>
        <button data-diff="4">进阶 4×4</button>
        <button data-diff="5">挑战 5×5</button>
      </div>
    </div>

    <div class="board-area">
      <div class="board-frame">
        <div class="board" id="board"></div>
        <div class="board-preview">
          <span>参考图</span>
          <img id="previewImg" src="" alt="参考图">
        </div>
      </div>
      <div class="win-overlay" id="winOverlay">
        <div class="win-card">
          <div class="win-emoji">🎉</div>
          <h3>拼图成功！</h3>
          <p id="winMsg">太棒了，你完成了拼图</p>
          <div class="win-btns">
            <button id="nextPuzzleBtn">下一张</button>
            <button id="replayBtn">再玩一次</button>
          </div>
        </div>
      </div>
    </div>

    <div class="game-controls">
      <button class="ctrl-btn ctrl-ghost" id="shuffleBtn">🔀 打乱</button>
      <button class="ctrl-btn ctrl-ghost" id="hintBtn">👁 看原图</button>
      <button class="ctrl-btn ctrl-reset" id="resetBtn">↺ 重置</button>
    </div>
    <p class="hint-text game-tip">点击两块拼图即可交换位置，全部归位即完成</p>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="game.js"></script>
</body>
</html>
